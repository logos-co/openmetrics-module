name: "Serve /metrics on Windows"
output: openmetrics-windows.md
project_name: openmetrics-module
release: ""

intro: |
  This doc-test checks the Windows build of `openmetrics`. CI stages the
  cross-built module beside a native `logosctl` host, loads it, starts the
  HTTP server and scrapes it with `curl`.

  The scrape targets `capability_module`, which ships with `logosctl` and has
  no `collectMetrics()`. That still makes the scraper call another module from
  the HTTP server thread, and an empty source must not break the document. The
  Linux and macOS doc-test scrapes real providers.

what_you_build: "The Windows openmetrics plugin serving /metrics from a native logosctl daemon."

what_you_learn:
  - How to stage openmetrics into a Windows logosctl session
  - How to start the server and scrape it on Windows

sections:
  - title: "Serve and scrape /metrics on Windows"
    platform: windows
    step: true
    text: |
      The shared Windows CI stages the cross-built module and `logosctl`.
      These commands run on a native Windows runner from that staged directory.
    steps:
      - title: "Stage the openmetrics module"
        text: |
          The session's `modules/` directory is where a daemon finds installed
          modules; `capability_module` stays in the bundled set beside the binary.
        run: |
          test -f windows-logosctl/modules/capability_module/manifest.json
          mkdir -p om-config/modules
          cp -R install-portable/modules/openmetrics om-config/modules/
        check_file: om-config/modules/openmetrics/manifest.json

      - title: "Start the Windows daemon"
        text: "`--detach` returns once the daemon accepts commands."
        run: "run windows-logosctl/bin/logosctl.exe --config-dir ./om-config daemon start --detach"
        expect_contains:
          - "Daemon started"

      - title: "Load openmetrics"
        run: "run windows-logosctl/bin/logosctl.exe --config-dir ./om-config module load openmetrics"
        expect_contains:
          - '"module":"openmetrics"'

      - title: "Start the server"
        text: |
          The config goes in a file: Windows strips the quotes from JSON passed
          on the command line.
        run: |
          printf '%s' '{"port":9099,"modules":["capability_module"]}' > om-start.json
          run windows-logosctl/bin/logosctl.exe --config-dir ./om-config call openmetrics start @om-start.json
        expect_contains:
          - '"result":1'

      - title: "Health check"
        run: "curl -s -m 30 http://127.0.0.1:9099/health"
        expect_contains:
          - "ok"

      - title: "Scrape /metrics"
        run: "curl -s -m 60 -D - http://127.0.0.1:9099/metrics"
        expect_contains:
          - "200 OK"
          - "application/openmetrics-text"
          - "# EOF"

      - title: "Unknown paths are 404"
        run: "curl -s -m 30 -o /dev/null -w '%{http_code}' http://127.0.0.1:9099/nope"
        expect_contains:
          - "404"

      - title: "getInfo reports what it's serving"
        run: "run windows-logosctl/bin/logosctl.exe --config-dir ./om-config call openmetrics getInfo"
        expect_contains:
          - '\"running\":true'
          - '\"port\":9099'

      - title: "Stop the server"
        run: "run windows-logosctl/bin/logosctl.exe --config-dir ./om-config call openmetrics stop"
        expect_contains:
          - '"result":1'

      - title: "Stop the Windows daemon"
        run: "run windows-logosctl/bin/logosctl.exe --config-dir ./om-config daemon stop"
        expect_contains:
          - '"status":"ok"'
